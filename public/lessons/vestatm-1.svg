117"/><rect x="0" y="495" width="900" height="5" fill="#111117"/><rect x="28" y="28" width="844" height="1217" fill="#101116" stroke="#33343e"/><rect x="29" y="29" width="842" height="3" fill="#d4bc7d"/><text x="58" y="86" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#e7e8ee">GP.</text><text x="157" y="72" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#a3a4b1">GIGAPROP / FIELD NOTES</text><text x="157" y="91" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#d4bc7d">VESTATM  /  EXECUTION SERIES</text><text x="720" y="78" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a3a4b1">ISSUE 01 / 01</text><path d="M58 112L842 112" stroke="#373944" stroke-width="1"/><path d="M58 1183L842 1183" stroke="#373944" stroke-width="1"/><text x="58" y="1212" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#d4bc7d">GIGAPROP  /  VESTATM</text><text x="381" y="1212" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a3a4b1">gigaprop.xyz/#vestpdf</text><text x="777" y="1212" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a3a4b1">01 / 02</text><polygon points="582.0,182.8 633.0,142.0 633.0,227.0" fill="#25252e"/><polygon points="735.0,142.0 786.0,182.8 735.0,227.0" fill="#25252e"/><polygon points="633.0,227.0 684.0,267.8 735.0,227.0 735.0,274.6 633.0,274.6" fill="#25252e"/><text x="55" y="203" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#e7e8ee">Vest</text><text x="228" y="203" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#d4bc7d">ATM.</text><text x="61" y="240" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#a3a4b1">THE 30-POINT PAYOUT PLAYBOOK</text><text x="60" y="320" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#e7e8ee">One clean move.</text><text x="60" y="367" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#e7e8ee">A defined exit.</text><text x="62" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#a3a4b1">NQ on Vest. Two simple setups. A 30-point target and stop.</text><text x="62" y="433" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#a3a4b1">The aim: turn a clear execution plan into a repeatable process.</text><rect x="60" y="469" width="254" height="119" fill="#1b1d25" stroke="#363841"/><text x="79" y="527" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#e7e8ee">30</text><text x="80" y="564" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#a3a4b1">POINT TAKE PROFIT</text><rect x="323" y="469" width="254" height="119" fill="#1b1d25" stroke="#363841"/><text x="342" y="527" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#e7e8ee">30</text><text x="343" y="564" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#a3a4b1">POINT STOP LOSS</text><rect x="586" y="469" width="254" height="119" fill="#1b1d25" stroke="#363841"/><text x="605" y="527" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#d4bc7d">250</text><text x="606" y="564" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#a3a4b1">USDC PAYOUT TARGET</text><text x="60" y="634" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#d4bc7d">01 / CHOOSE THE SETUP</text><rect x="60" y="658" width="378" height="329" fill="#171920" stroke="#30333d"/><rect x="456" y="658" width="384" height="329" fill="#171920" stroke="#30333d"/><text x="80" y="692" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#e7e8ee">IMPULSE + RETEST</text><text x="477" y="692" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#e7e8ee">LEVEL + REJECTION</text><path d="M82 781L415 781" stroke="#75694f" stroke-width="1"/><text x="84" y="764" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#d4bc7d">BROKEN LEVEL</text><path d="M101 802L101 837" stroke="#a8d6bc" stroke-width="1"/><rect x="96" y="811" width="10" height="17" fill="#a8d6bc"/><path d="M129 791L129 823" stroke="#a8d6bc" stroke-width="1"/><rect x="124" y="800" width="10" height="14" fill="#a8d6bc"/><path d="M157 766L157 808" stroke="#a8d6bc" stroke-width="1"/><rect x="152" y="775" width="10" height="24" fill="#a8d6bc"/><path d="M185 729L185 782" stroke="#a8d6bc" stroke-width="1"/><rect x="180" y="738" width="10" height="35" fill="#a8d6bc"/><path d="M213 721L213 751" stroke="#a8d6bc" stroke-width="1"/><rect x="208" y="730" width="10" height="12" fill="#a8d6bc"/><path d="M241 741L241 774" stroke="#dba0ad" stroke-width="1"/><rect x="236" y="750" width="10" height="15" fill="#dba0ad"/><path d="M269 757L269 788" stroke="#dba0ad" stroke-width="1"/><rect x="264" y="766" width="10" height="13" fill="#dba0ad"/><path d="M297 736L297 784" stroke="#a8d6bc" stroke-width="1"/><rect x="292" y="745" width="10" height="30" fill="#a8d6bc"/><path d="M325 719L325 755" stroke="#a8d6bc" stroke-width="1"/><rect x="320" y="728" width="10" height="18" fill="#a8d6bc"/><path d="M353 700L353 738" stroke="#a8d6bc" stroke-width="1"/><rect x="348" y="709" width="10" height="20" fill="#a8d6bc"/><text x="274" y="822" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#a8d6bc">RETEST HOLDS</text><path d="M480 814L813 814" stroke="#75694f" stroke-width="1"/><text x="480" y="840" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#d4bc7d">PRE-MARKED SUPPORT</text><path d="M495 711L495 749" stroke="#dba0ad" stroke-width="1"/><rect x="490" y="720" width="10" height="20" fill="#dba0ad"/><path d="M525 733L525 771" stroke="#dba0ad" stroke-width="1"/><rect x="520" y="742" width="10" height="20" fill="#dba0ad"/><path d="M555 756L555 795" stroke="#dba0ad" stroke-width="1"/><rect x="550" y="765" width="10" height="21" fill="#dba0ad"/><path d="M585 781L585 813" stroke="#dba0ad" stroke-width="1"/><rect x="580" y="790" width="10" height="14" fill="#dba0ad"/><path d="M615 784L615 814" stroke="#a8d6bc" stroke-width="1"/><rect x="610" y="793" width="10" height="12" fill="#a8d6bc"/><path d="M645 757L645 802" stroke="#a8d6bc" stroke-width="1"/><rect x="640" y="766" width="10" height="27" fill="#a8d6bc"/><path d="M675 737L675 775" stroke="#a8d6bc" stroke-width="1"/><rect x="670" y="746" width="10" height="20" fill="#a8d6bc"/><path d="M705 717L705 752" stroke="#a8d6bc" stroke-width="1"/><rect x="700" y="726" width="10" height="17" fill="#a8d6bc"/><path d="M735 708L735 736" stroke="#a8d6bc" stroke-width="1"/><rect x="730" y="717" width="10" height="10" fill="#a8d6bc"/><text x="80" y="878" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a4b1">Price breaks a clear level with force.</text><text x="80" y="902" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a4b1">Wait for a brief pullback that holds.</text><text x="80" y="926" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a4b1">Enter on a close back with the move.</text><text x="477" y="878" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a4b1">Mark the level before price arrives.</text><text x="477" y="902" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a4b1">Let price reject it and close away.</text><text x="477" y="926" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a4b1">Enter in the rejection direction.</text><text x="80" y="969" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#a3a4b1">SCHEMATIC / LONG EXAMPLE</text><text x="477" y="969" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#a3a4b1">SCHEMATIC / LONG EXAMPLE</text><text x="61" y="1035" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#d4bc7d">THE FILTER IS CLARITY.</text><text x="61" y="1067" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a4b1">Use one setup. Reverse the logic for shorts. If the idea needs more than a</text><text x="61" y="1092" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a4b1">30-point stop to be invalidated, this is not the setup for this fixed-stop plan.</text><text x="61" y="1117" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a4b1">These are entry templates, not a demonstrated win-rate or guaranteed edge.</text></svg>