151b"/><rect x="0" y="325" width="900" height="5" fill="#15151b"/><rect x="0" y="330" width="900" height="5" fill="#15151b"/><rect x="0" y="335" width="900" height="5" fill="#15151b"/><rect x="0" y="340" width="900" height="5" fill="#15151b"/><rect x="0" y="345" width="900" height="5" fill="#15151b"/><rect x="0" y="350" width="900" height="5" fill="#14141a"/><rect x="0" y="355" width="900" height="5" fill="#14141a"/><rect x="0" y="360" width="900" height="5" fill="#14141a"/><rect x="0" y="365" width="900" height="5" fill="#14141a"/><rect x="0" y="370" width="900" height="5" fill="#14141a"/><rect x="0" y="375" width="900" height="5" fill="#14141a"/><rect x="0" y="380" width="900" height="5" fill="#14141a"/><rect x="0" y="385" width="900" height="5" fill="#131319"/><rect x="0" y="390" width="900" height="5" fill="#131319"/><rect x="0" y="395" width="900" height="5" fill="#131319"/><rect x="0" y="400" width="900" height="5" fill="#131319"/><rect x="0" y="405" width="900" height="5" fill="#131319"/><rect x="0" y="410" width="900" height="5" fill="#131319"/><rect x="0" y="415" width="900" height="5" fill="#131319"/><rect x="0" y="420" width="900" height="5" fill="#131319"/><rect x="0" y="425" width="900" height="5" fill="#121218"/><rect x="0" y="430" width="900" height="5" fill="#121218"/><rect x="0" y="435" width="900" height="5" fill="#121218"/><rect x="0" y="440" width="900" height="5" fill="#121218"/><rect x="0" y="445" width="900" height="5" fill="#121218"/><rect x="0" y="450" width="900" height="5" fill="#121218"/><rect x="0" y="455" width="900" height="5" fill="#121218"/><rect x="0" y="460" width="900" height="5" fill="#121218"/><rect x="0" y="465" width="900" height="5" fill="#111117"/><rect x="0" y="470" width="900" height="5" fill="#111117"/><rect x="0" y="475" width="900" height="5" fill="#111117"/><rect x="0" y="480" width="900" height="5" fill="#111117"/><rect x="0" y="485" width="900" height="5" fill="#111117"/><rect x="0" y="490" width="900" height="5" fill="#111117"/><rect x="0" y="495" width="900" height="5" fill="#111117"/><rect x="28" y="28" width="844" height="1217" fill="#101116" stroke="#33343e"/><rect x="29" y="29" width="842" height="3" fill="#bdc2d0"/><text x="58" y="86" font-family="Arial, sans-serif" font-size="39" font-weight="700" fill="#e7e8ee">GP.</text><text x="157" y="72" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#a3a4b1">GIGAPROP / FIELD NOTES</text><text x="157" y="91" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#d4bc7d">VESTATM  /  EXECUTION SERIES</text><text x="720" y="78" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a3a4b1">ISSUE 01 / 02</text><path d="M58 112L842 112" stroke="#373944" stroke-width="1"/><path d="M58 1183L842 1183" stroke="#373944" stroke-width="1"/><text x="58" y="1212" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#d4bc7d">GIGAPROP  /  VESTATM</text><text x="381" y="1212" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a3a4b1">gigaprop.xyz/#vestpdf</text><text x="777" y="1212" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#a3a4b1">02 / 02</text><text x="58" y="181" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#e7e8ee">EXECUTE.</text><text x="58" y="238" font-family="Arial, sans-serif" font-size="50" font-weight="700" fill="#d4bc7d">THEN EXTRACT.</text><text x="62" y="275" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#a3a4b1">02 / THE ORDER, THE MATH, THE PAYOUT</text><rect x="60" y="306" width="780" height="150" fill="#1a1d25" stroke="#393b46"/><text x="81" y="341" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#d4bc7d">LONG EXAMPLE</text><text x="80" y="387" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#e7e8ee">ENTRY 30,000</text><text x="410" y="344" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a8d6bc">TP 30,030</text><text x="410" y="379" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#dba0ad">SL 29,970</text><text x="81" y="430" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#a3a4b1">For a short: TP = entry - 30  /  SL = entry + 30. Anchor to the actual fill.</text><text x="60" y="503" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#e7e8ee">SIZE IN DOLLARS PER POINT.</text><text x="60" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a4b1">30 points x $8.33/point = about $250 gross trading P&amp;L.</text><text x="60" y="559" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a4b1">A 30-point stop loses about $250 before costs. That is not a $250 payout.</text><rect x="60" y="595" width="780" height="224" fill="#242128" stroke="#534938"/><text x="80" y="630" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#d4bc7d">IF YOU WANT 250 USDC AFTER YOUR SPLIT</text><text x="80" y="670" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#e7e8ee">$/point = (250 / split + costs) / 30</text><text x="81" y="705" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#a3a4b1">Example only: 80% split + $8 estimated round-trip costs</text><text x="80" y="753" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#d4bc7d">$10.68 / pt</text><text x="340" y="744" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#e7e8ee">30-point win: ~$320.50 gross - $8 = $312.50</text><text x="340" y="768" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#e7e8ee">80% claim share: ~$250  |  Stop loss: ~$328.50</text><text x="81" y="799" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">Replace $8 with your actual fees + spread/slippage. Costs change with size.</text><text x="60" y="869" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#d4bc7d">01</text><text x="60" y="897" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#e7e8ee">PLACE + PROTECT</text><text x="60" y="925" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">Confirm size and fill. Attach TP/SL.</text><text x="60" y="944" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">Check stop execution type and</text><text x="60" y="963" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">available room above the fail floor.</text><text x="326" y="869" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#d4bc7d">02</text><text x="326" y="897" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#e7e8ee">CLOSE + CHECK</text><text x="326" y="925" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">Read realized P&amp;L after costs.</text><text x="326" y="944" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">Earlier losses reduce claimable</text><text x="326" y="963" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">profit; each win is not a new payout.</text><text x="592" y="869" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#d4bc7d">03</text><text x="592" y="897" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#e7e8ee">CLAIM + WITHDRAW</text><text x="592" y="925" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">Claim from the Live account.</text><text x="592" y="944" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">Then withdraw from Primary</text><text x="592" y="963" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">to your chosen receiving wallet.</text><path d="M60 989L840 989" stroke="#373944" stroke-width="1"/><text x="60" y="1015" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">Leverage controls required margin, not dollars per point. At 1:1 price distance,</text><text x="60" y="1035" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">fees make the net loss larger than the net win. Stops can slip or fail to fill.</text><text x="60" y="1055" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#a3a4b1">A $250 target is a plan, not guaranteed income. Check current account terms.</text><text x="60" y="1100" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#e7e8ee">READY TO OPEN YOUR VEST ACCOUNT?</text><text x="60" y="1126" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#d4bc7d">next.vestmarkets.com/r/isgigaprop  /  5% off</text><text x="60" y="1147" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#a3a4b1">Referral link: GIGAPROP may earn a commission.</text><text x="60" y="1167" font-family="Arial, sans-serif" font-size="8" font-weight="400" fill="#a3a4b1">Sources: docs.vestmarkets.com / trading/order-types / vest-capital/claiming-profit</text></svg>