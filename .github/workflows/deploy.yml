name: Deploy gigaprop

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install gigaprop dependencies
        run: npm install

      - name: Install Maven Edition dependencies
        run: npm install --prefix maven-site

      - name: Build gigaprop
        run: npm run build

      - name: Build Maven Edition
        run: npm run build --prefix maven-site

      - name: Add Maven Edition to Pages artifact
        run: |
          mkdir -p dist/maven
          cp -R maven-site/dist/. dist/maven/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
